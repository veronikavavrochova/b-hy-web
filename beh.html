<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Záznam z běhu</title>
    <link rel="stylesheet" href="styl.css">
    <link rel="icon" href="beh.jpg">
</head>
<body>

    <div class="karta">
        <h1>Jaký byl tvůj dnešní běh?</h1>
        
        <ul>
            <li>Dnešní běh byl skvělý!</li>
        </ul>
        
        <form action="https://webhook.site" method="POST">
            <h3>Zapsat nový běh</h3>
            
            <label for="hodnoceni">Hodnocení běhu:</label><br>
            <select id="hodnoceni" name="hodnoceni">
                <option value="skvely">Skvělý!</option>
                <option value="dobry">Dobrý, ale bolely nohy</option>
                <option value="narocny">Náročný / těžký</option>
            </select>
            <br><br>

            <label for="poznamka">Poznámka k tréninku:</label><br>
            <input type="text" id="poznamka" name="poznamka">
            <br><br>

            <button type="submit">Odeslat záznam</button>
        </form>

        <p class="odkaz">Více o trénincích najdeš na <a href="https://strava.com">Strava.com</a></p>
    </div>

    <br>
    <img src="gepard.jpg" alt="Gepard">
    <br><br>

    <table class="tabulka" border="1">
        <tr>
            <th>Nejlepší</th>
            <th>Dobrý</th>
            <th>Nic moc</th>
        </tr>
        <tr>
            <td>Rychlý běh bez únavy</td>
            <td>Pohodové tempo, trochu bolely nohy</td>
            <td>Těžké nohy, málo energie</td>
        </tr>
        <tr>
            <td>Nový osobní rekord</td>
            <td>Splněný plánovaný trénink</td>
            <td>Krátký běh, špatné počasí</td>
        </tr>
    </table>

</body>
</html>
